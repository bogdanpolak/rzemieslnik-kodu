<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 0 1160 350" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Source Gradient -->
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- AST / Parser Gradients -->
    <linearGradient id="parserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="astGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="plannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Lexer / Tokens Gradients -->
    <linearGradient id="lexerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="tokensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Emitter & Output Gradients -->
    <linearGradient id="emitterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowAst" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#818CF8" flood-opacity="0.25" />
    </filter>
    <filter id="glowTokens" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2DD4BF" flood-opacity="0.2" />
    </filter>
    <filter id="glowEmitter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FBBF24" flood-opacity="0.25" />
    </filter>
    <filter id="glowOutput" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#34D399" flood-opacity="0.3" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrow-ast" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8" />
    </marker>
    <marker id="arrow-tokens" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2DD4BF" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FBBF24" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399" />
    </marker>
  </defs>


  <!-- Subtle Zone Backgrounds -->
  <!-- Top Lane (AST Semantic Layout) -->
  <rect x="230" y="22" width="595" height="136" rx="16" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
  <text x="245" y="42" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">BRANCH A: AST SEMANTIC STRUCTURE &amp; LAYOUT</text>

  <!-- Bottom Lane (Token Lexical Stream) -->
  <rect x="230" y="172" width="595" height="136" rx="16" fill="#064E3B" stroke="#0D9488" stroke-width="1"/>
  <text x="245" y="192" fill="#5EEAD4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">BRANCH B: LOSSLESS LEXICAL TOKEN STREAM</text>

  <!-- NODES -->

  <!-- 1. Source Node -->
  <g transform="translate(110, 130)">
    <rect width="80" height="80" fill="white" stroke="#bbb" stroke-width="2" stroke-dasharray="4,4" filter="url(#cardShadow)" />
    <text x="40" y="45" fill="#666" font-family="Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle">Source</text>
  </g>

  <!-- 2. TPasSyntaxTreeBuilder -->
  <g transform="translate(250, 62)" filter="url(#glowAst)">
    <rect width="195" height="76" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.8" />
    <text x="97" y="32" fill="#EEF2FF" font-family="Consolas, monospace" font-size="13" font-weight="bold" text-anchor="middle">TPasSyntaxTreeBuilder</text>
    <text x="97" y="50" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">DelphiAST Parser</text>
    <text x="97" y="65" fill="#818CF8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">(Semantic grammar analysis)</text>
  </g>

  <!-- 3. AST (TSyntaxNode) -->
  <g transform="translate(485, 72)">
    <rect width="120" height="56" rx="10" fill="#2E1065" stroke="#A855F7" stroke-width="1.5" />
    <text x="60" y="27" fill="#FAF5FF" font-family="Consolas, monospace" font-size="14" font-weight="bold" text-anchor="middle">AST</text>
    <text x="60" y="44" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11" text-anchor="middle">TSyntaxNode</text>
  </g>

  <!-- 4. TLayoutPlanner -->
  <g transform="translate(645, 62)" filter="url(#glowAst)">
    <rect width="165" height="76" rx="12" fill="#3B0764" stroke="#C084FC" stroke-width="1.8" />
    <text x="82" y="32" fill="#FAF5FF" font-family="Consolas, monospace" font-size="14" font-weight="bold" text-anchor="middle">TLayoutPlanner</text>
    <text x="82" y="50" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">AST Visitor / Planner</text>
    <text x="82" y="65" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Marks break, indent &amp; joins</text>
  </g>

  <!-- 5. TmwPasLex -->
  <g transform="translate(250, 212)" filter="url(#glowTokens)">
    <rect width="195" height="76" rx="12" fill="#042F2E" stroke="#14B8A6" stroke-width="1.8" />
    <text x="97" y="32" fill="#F0FDFA" font-family="Consolas, monospace" font-size="14" font-weight="bold" text-anchor="middle">TmwPasLex</text>
    <text x="97" y="50" fill="#5EEAD4" font-family="Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">UseDefines = False</text>
    <text x="97" y="65" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Retains all tokens &amp; defines</text>
  </g>

  <!-- 6. TSourceTokens -->
  <g transform="translate(485, 212)" filter="url(#glowTokens)">
    <rect width="185" height="76" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.8" />
    <text x="92" y="32" fill="#ECFDF5" font-family="Consolas, monospace" font-size="14" font-weight="bold" text-anchor="middle">TSourceTokens</text>
    <text x="92" y="50" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Sequential Token Buffer</text>
    <text x="92" y="65" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Comments, directives &amp; line/col</text>
  </g>

  <!-- 7. TTokenEmitter -->
  <g transform="translate(920, 128)" filter="url(#glowEmitter)">
    <rect width="160" height="84" rx="14" fill="#451A03" stroke="#F59E0B" stroke-width="2" />
    <text x="80" y="34" fill="#FFFBEB" font-family="Consolas, monospace" font-size="14" font-weight="bold" text-anchor="middle">TTokenEmitter</text>
    <text x="80" y="52" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Token-by-Token Writer</text>
    <text x="80" y="68" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Spacing &amp; indent rules</text>
  </g>

  <!-- 8. Formatted Output -->
  <g transform="translate(1130, 128)" filter="url(#glowOutput)">
    <rect width="80" height="80" fill="white" stroke="#bbb" stroke-width="2" stroke-dasharray="4,4" filter="url(#cardShadow)" />
    <text x="40" y="45" fill="#666" font-family="Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle">Output</text>
  </g>

  <!-- Invariant Footer Badges -->
  <g transform="translate(200, 320)">
    <rect width="640" height="28" rx="5" fill="white" stroke="#ccc" stroke-width="1" filter="url(#cardShadow)" />
    <text x="320" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
      <tspan fill="#088DE8">Invariants:</tspan> 
      <tspan fill="#282A2C" font-family="Consolas, monospace"> TokenFingerprint(Input) == TokenFingerprint(Output) </tspan> | 
      <tspan fill="#282A2C" font-family="Consolas, monospace"> Format(Format(Code)) == Format(Code) </tspan>
    </text>
  </g>

  <!-- Connector Lines & Paths -->

  <!-- Split paths from Source 210 -> 170  -->
  <path d="M 190 160 C 215 160, 205 100, 240 100" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#arrow-ast)" />
  <path d="M 190 180 C 215 180, 205 250, 240 250" fill="none" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-tokens)" />

  <!-- Top branch paths -->
  <path d="M 445 100 L 475 100" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#arrow-ast)" />
  <path d="M 605 100 L 635 100" fill="none" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-ast)" />

  <!-- Bottom branch paths -->
  <path d="M 445 250 L 475 250" fill="none" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-tokens)" />

  <!-- Convergence paths into TTokenEmitter -->
  <path d="M 810 100 C 845 100, 875 160, 908 160" fill="none" stroke="#C084FC" stroke-width="2.5" marker-end="url(#arrow-ast)" />
  <path d="M 670 250 C 785 250, 875 180, 908 180" fill="none" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrow-tokens)" />

  <!-- Output path from TTokenEmitter -->
  <path d="M 1080 170 L 1118 170" fill="none" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-emerald)" />

  <!-- Flow Badges / Labels on Convergence -->
  <g transform="translate(825, 130)">
    <rect x="-10" y="-12" width="105" height="22" rx="11" fill="#3B0764" stroke="#A855F7" stroke-width="1" />
    <text x="42" y="3" fill="#F3E8FF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Layout Marks</text>
  </g>
  <g transform="translate(735, 220)">
    <rect x="-10" y="-12" width="115" height="22" rx="11" fill="#042F2E" stroke="#14B8A6" stroke-width="1" />
    <text x="47" y="3" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">All Source Tokens</text>
  </g>
</svg>
